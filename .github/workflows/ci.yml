name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy src/engram

      - name: Pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t engram:ci .

      - name: Smoke test container
        run: |
          docker run -d --name engram-ci -p 8000:8000 engram:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          docker stop engram-ci
          docker rm engram-ci
