services:
  engram:
    build: .
    container_name: engram
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MEMORY_API_KEY: ${MEMORY_API_KEY:?set MEMORY_API_KEY in .env or the shell}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
